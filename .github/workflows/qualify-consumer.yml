name: qualify-consumer

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Runtime profiles to qualify
        required: true
        default: core+numpy
        type: choice
        options:
          - core
          - core+numpy
          - core+numpy+fenics
  pull_request:
    paths:
      - ".github/workflows/qualify-consumer.yml"
      - "vendor/python-runtime-consumer-kit/**"
      - "vendor/python-runtime-consumer-kit.upstream.json"
      - "bridge-build.json"
      - "src/**"
      - "python/**"
      - "host/**"
      - "locks/consumer/python-runtime-cp314.json"
      - "tools/check_consumer_kit.py"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qualify-consumer.yml"
      - "vendor/python-runtime-consumer-kit/**"
      - "vendor/python-runtime-consumer-kit.upstream.json"
      - "bridge-build.json"
      - "src/**"
      - "python/**"
      - "host/**"
      - "locks/consumer/python-runtime-cp314.json"
      - "tools/check_consumer_kit.py"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: consumer-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REFERENCE_RUNTIME_RECEIPT: locks/consumer/python-runtime-cp314.json
  OCTAVE_WINDOWS_VERSION: "11.3.0"
  OCTAVE_WINDOWS_RELEASE_TAG: release-11-3-0
  OCTAVE_WINDOWS_ARCHIVE_SHA256: fd3cf0e885467a15211b8ceded42800432a5462481324d49a896ef257e05d1a0
  OCTAVE_MACOS_VERSION: "10.3.0"
  OCTAVE_MACOS_ARM64_BUILD: pl5321hb61a5b2_4
  OCTAVE_MACOS_ARM64_SHA256: 88d228e05ee9e5bf08038ddd9678d3073d2f40060e7ace5704676ce94027c89f
  OCTAVE_MACOS_ARM64_OPENSSL_BUILD: h55eecbc_0
  OCTAVE_MACOS_ARM64_OPENSSL_SHA256: a26829f8d4ed2631216a8543ef7704d2cff90ce43e381015530ab21cf762b681
  OCTAVE_MACOS_X64_BUILD: pl5321hf9cc832_4
  OCTAVE_MACOS_X64_SHA256: 52627df280641aa38099a5f4aad797306852fa8fff2dd3001559fd1a6b6ac341
  OCTAVE_MACOS_X64_OPENSSL_BUILD: h332eb6d_0
  OCTAVE_MACOS_X64_OPENSSL_SHA256: 4747221abec91a82a8ebd7e8b36eac90c21c74435f9473c86c0e41a9305f2183
  OCTAVE_MACOS_OPENSSL_VERSION: "3.5.9"
  OCTAVE_LINUX_VERSION: "11.3.0"
  OCTAVE_LINUX_IMAGE: ghcr.io/gnu-octave/octave:11.3.0@sha256:185db7993e000d4f3f6e7bbbf7fb3f999f52e799ea52231ad8a15353381e0dcb
  MANYLINUX2014_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50

jobs:
  contract:
    name: downstream contract
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify vendored kit and consumer contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_consumer_kit.py
          python -m unittest discover -s tests -v

  build:
    name: build-once / ${{ matrix.target }}
    needs:
      - contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up pinned micromamba for macOS Octave
        if: startsWith(matrix.target, 'macos-')
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          micromamba-version: '2.10.0-0'

      - name: Install pinned GNU Octave on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $archiveName = "octave-$env:OCTAVE_WINDOWS_VERSION-w64.7z"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $root = Join-Path $env:RUNNER_TEMP "octave-$env:OCTAVE_WINDOWS_VERSION"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          gh release download $env:OCTAVE_WINDOWS_RELEASE_TAG --repo gnu-octave/octave --pattern $archiveName --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "failed to download pinned GNU Octave release asset" }
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:OCTAVE_WINDOWS_ARCHIVE_SHA256) {
            throw "GNU Octave archive SHA-256 mismatch: $sha"
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          & 7z x $archive "-o$root" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "failed to extract pinned GNU Octave archive" }
          $octave = Get-ChildItem -LiteralPath $root -Recurse -File -Filter octave-cli.exe |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $octave) {
            throw "GNU Octave executable was not found in pinned release archive"
          }
          $mexHeader = Get-ChildItem -LiteralPath $root -Recurse -File -Filter mex.h |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $mexHeader) {
            throw "GNU Octave mex.h was not found in pinned release archive"
          }
          $version = (& $octave.FullName --version | Select-Object -First 1)
          if ($version -notmatch [regex]::Escape($env:OCTAVE_WINDOWS_VERSION)) {
            throw "unexpected GNU Octave version: $version"
          }
          $bin = Split-Path -Parent $octave.FullName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "REFERENCE_OCTAVE=$($octave.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OCTAVE_VERSION=$env:OCTAVE_WINDOWS_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OCTAVE_INCLUDE_DIRS=$($mexHeader.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Source pinned GNU Octave headers on Linux
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e "OCTAVE_LINUX_VERSION=$OCTAVE_LINUX_VERSION" \
            -v "$workspace:$workspace" \
            -w "$workspace" \
            --entrypoint bash \
            "$OCTAVE_LINUX_IMAGE" \
            -lc '
              set -euo pipefail
              test "$(octave-config -p VERSION)" = "$OCTAVE_LINUX_VERSION"
              octave_include="$(octave-config -p OCTINCLUDEDIR)"
              test -f "$octave_include/mex.h"
              rm -rf build/octave-headers
              mkdir -p build/octave-headers
              cp -a "$octave_include/." build/octave-headers/
            '

      - name: Install pinned GNU Octave on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos-arm64)
              subdir=osx-arm64
              build="$OCTAVE_MACOS_ARM64_BUILD"
              expected_sha="$OCTAVE_MACOS_ARM64_SHA256"
              openssl_build="$OCTAVE_MACOS_ARM64_OPENSSL_BUILD"
              openssl_sha="$OCTAVE_MACOS_ARM64_OPENSSL_SHA256"
              ;;
            macos-x64)
              subdir=osx-64
              build="$OCTAVE_MACOS_X64_BUILD"
              expected_sha="$OCTAVE_MACOS_X64_SHA256"
              openssl_build="$OCTAVE_MACOS_X64_OPENSSL_BUILD"
              openssl_sha="$OCTAVE_MACOS_X64_OPENSSL_SHA256"
              ;;
            *)
              echo "unexpected macOS target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          archive="octave-$OCTAVE_MACOS_VERSION-$build.conda"
          url="https://conda.anaconda.org/conda-forge/$subdir/$archive"
          download="$RUNNER_TEMP/$archive"
          openssl_archive="openssl-$OCTAVE_MACOS_OPENSSL_VERSION-$openssl_build.conda"
          openssl_url="https://conda.anaconda.org/conda-forge/$subdir/$openssl_archive"
          openssl_download="$RUNNER_TEMP/$openssl_archive"
          prefix="$RUNNER_TEMP/reference-octave-$subdir"
          rm -f "$download"
          rm -f "$openssl_download"
          rm -rf "$prefix"
          curl --fail --location --retry 3 --output "$download" "$url"
          printf '%s  %s\n' "$expected_sha" "$download" | shasum -a 256 -c -
          curl --fail --location --retry 3 --output "$openssl_download" "$openssl_url"
          printf '%s  %s\n' "$openssl_sha" "$openssl_download" | shasum -a 256 -c -
          python3 vendor/python-runtime-consumer-kit/tools/install-pinned-octave-macos.py \
            --micromamba "$MAMBA_EXE" --prefix "$prefix" --subdir "$subdir" \
            --octave-archive "$download" --octave-sha256 "$expected_sha" \
            --octave-version "$OCTAVE_MACOS_VERSION" --octave-build "$build" \
            --openssl-archive "$openssl_download" --openssl-sha256 "$openssl_sha" \
            --openssl-version "$OCTAVE_MACOS_OPENSSL_VERSION" --openssl-build "$openssl_build"
          "$MAMBA_EXE" list -p "$prefix"
          python3 - "$prefix" "$OCTAVE_MACOS_VERSION" "$build" "$OCTAVE_MACOS_OPENSSL_VERSION" "$openssl_build" <<'PY'
          import json
          import pathlib
          import sys

          prefix = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]
          expected_build = sys.argv[3]
          expected_openssl_version = sys.argv[4]
          expected_openssl_build = sys.argv[5]
          packages = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted((prefix / "conda-meta").glob("*.json"))
          ]
          octave = [record for record in packages if record.get("name") == "octave"]
          if len(octave) != 1:
              raise SystemExit(f"expected one GNU Octave package, found {len(octave)}")
          octave_build = octave[0].get("build_string", octave[0].get("build"))
          if octave[0].get("version") != expected_version or octave_build != expected_build:
              raise SystemExit(
                  "GNU Octave package identity mismatch: "
                  f"{octave[0].get('version')}={octave_build} != {expected_version}={expected_build}"
              )
          openssl = [record for record in packages if record.get("name") == "openssl"]
          if len(openssl) != 1:
              raise SystemExit(f"expected one OpenSSL package, found {len(openssl)}")
          openssl_build = openssl[0].get("build_string", openssl[0].get("build"))
          if (
              openssl[0].get("version") != expected_openssl_version
              or openssl_build != expected_openssl_build
          ):
              raise SystemExit(
                  "GNU Octave OpenSSL identity mismatch: "
                  f"{openssl[0].get('version')}={openssl_build} != "
                  f"{expected_openssl_version}={expected_openssl_build}"
              )
          forbidden = {"mpi", "mpich", "openmpi", "open-mpi"}
          present = sorted(
              record["name"]
              for record in packages
              if str(record.get("name", "")).lower() in forbidden
          )
          if present:
              raise SystemExit(f"GNU Octave host environment contains an MPI runtime: {present}")
          PY
          if find "$prefix" -type f \( -name 'libmpi*.dylib' -o -name 'libmpich*.dylib' \) -print -quit | grep -q .; then
            echo "GNU Octave host environment contains an MPI shared library" >&2
            exit 1
          fi
          octave="$prefix/bin/octave-cli"
          octave_config="$prefix/bin/octave-config"
          test -x "$octave"
          test -x "$octave_config"
          export OCTAVE_HOME="$prefix"
          test "$("$octave_config" -p VERSION)" = "$OCTAVE_MACOS_VERSION"
          test "$("$octave_config" -p OCTAVE_HOME)" = "$prefix"
          mex_header="$(find "$prefix/include" -type f -name mex.h -print -quit)"
          test -n "$mex_header"
          test -f "$mex_header"
          echo "REFERENCE_OCTAVE=$octave" >> "$GITHUB_ENV"
          echo "OCTAVE_HOME=$prefix" >> "$GITHUB_ENV"
          echo "OCTAVE_VERSION=$OCTAVE_MACOS_VERSION" >> "$GITHUB_ENV"
          echo "OCTAVE_INCLUDE_DIRS=$(dirname "$mex_header")" >> "$GITHUB_ENV"

      - name: Stage and verify core build runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python vendor/python-runtime-consumer-kit/tools/stage-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile core --cache build/reference-cache --output "build/reference/build-core/${{ matrix.target }}/runtime" --record "build/reference/build-core/${{ matrix.target }}/runtime-receipt.json"
          python vendor/python-runtime-consumer-kit/tools/verify-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile core --cache build/reference-cache --runtime "build/reference/build-core/${{ matrix.target }}/runtime" --record "build/reference/build-core/${{ matrix.target }}/runtime-verify.json"

      - name: Build candidate with MSVC
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & vendor/python-runtime-consumer-kit/tools/build.ps1 `
            --manifest bridge-build.json `
            --source-root . `
            --runtime "build/reference/build-core/${{ matrix.target }}/runtime" `
            --output-dir "build/reference/candidate/${{ matrix.target }}" `
            --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json"

      - name: Build Linux candidate in pinned manylinux2014
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test -f build/octave-headers/mex.h
          workspace="$GITHUB_WORKSPACE"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e "GITHUB_SHA=$GITHUB_SHA" \
            -e "OCTAVE_VERSION=$OCTAVE_LINUX_VERSION" \
            -e "OCTAVE_INCLUDE_DIRS=$workspace/build/octave-headers" \
            -e "PYTHON=/opt/python/cp312-cp312/bin/python" \
            -v "$workspace:$workspace" \
            -w "$workspace" \
            "$MANYLINUX2014_IMAGE" \
            bash vendor/python-runtime-consumer-kit/tools/build-linux.sh \
              --manifest bridge-build.json \
              --source-root . \
              --runtime "build/reference/build-core/${{ matrix.target }}/runtime" \
              --output-dir "build/reference/candidate/${{ matrix.target }}" \
              --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json"

      - name: Build macOS candidate with Clang
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          REFERENCE_BRIDGE_TARGET="${{ matrix.target }}" \
            bash vendor/python-runtime-consumer-kit/tools/build-macos.sh \
              --manifest bridge-build.json \
              --source-root . \
              --runtime "build/reference/build-core/${{ matrix.target }}/runtime" \
              --output-dir "build/reference/candidate/${{ matrix.target }}" \
              --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-candidate-${{ matrix.target }}
          path: build/reference/candidate/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  qualify:
    name: qualify / ${{ matrix.target }} / ${{ matrix.profile }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - win-x64
          - linux-x64
          - macos-arm64
          - macos-x64
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profiles == 'core' && '["core"]' || github.event_name == 'workflow_dispatch' && inputs.profiles == 'core+numpy+fenics' && '["core","numpy","fenics"]' || '["core","numpy"]') }}
        include:
          - target: win-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up pinned micromamba for macOS Octave
        if: startsWith(matrix.target, 'macos-')
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          micromamba-version: '2.10.0-0'

      - name: Download exact target candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: consumer-candidate-${{ matrix.target }}
          path: build/reference/candidate/${{ matrix.target }}

      - name: Install pinned GNU Octave on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $archiveName = "octave-$env:OCTAVE_WINDOWS_VERSION-w64.7z"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $root = Join-Path $env:RUNNER_TEMP "octave-$env:OCTAVE_WINDOWS_VERSION"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          gh release download $env:OCTAVE_WINDOWS_RELEASE_TAG --repo gnu-octave/octave --pattern $archiveName --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "failed to download pinned GNU Octave release asset" }
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:OCTAVE_WINDOWS_ARCHIVE_SHA256) {
            throw "GNU Octave archive SHA-256 mismatch: $sha"
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          & 7z x $archive "-o$root" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "failed to extract pinned GNU Octave archive" }
          $octave = Get-ChildItem -LiteralPath $root -Recurse -File -Filter octave-cli.exe |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $octave) { throw "GNU Octave executable was not found in pinned release archive" }
          $mexHeader = Get-ChildItem -LiteralPath $root -Recurse -File -Filter mex.h |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $mexHeader) { throw "GNU Octave mex.h was not found in pinned release archive" }
          $version = (& $octave.FullName --version | Select-Object -First 1)
          if ($version -notmatch [regex]::Escape($env:OCTAVE_WINDOWS_VERSION)) {
            throw "unexpected GNU Octave version: $version"
          }
          $bin = Split-Path -Parent $octave.FullName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "REFERENCE_OCTAVE=$($octave.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OCTAVE_VERSION=$env:OCTAVE_WINDOWS_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OCTAVE_INCLUDE_DIRS=$($mexHeader.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned GNU Octave on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos-arm64)
              subdir=osx-arm64
              build="$OCTAVE_MACOS_ARM64_BUILD"
              expected_sha="$OCTAVE_MACOS_ARM64_SHA256"
              openssl_build="$OCTAVE_MACOS_ARM64_OPENSSL_BUILD"
              openssl_sha="$OCTAVE_MACOS_ARM64_OPENSSL_SHA256"
              ;;
            macos-x64)
              subdir=osx-64
              build="$OCTAVE_MACOS_X64_BUILD"
              expected_sha="$OCTAVE_MACOS_X64_SHA256"
              openssl_build="$OCTAVE_MACOS_X64_OPENSSL_BUILD"
              openssl_sha="$OCTAVE_MACOS_X64_OPENSSL_SHA256"
              ;;
            *)
              echo "unexpected macOS target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          archive="octave-$OCTAVE_MACOS_VERSION-$build.conda"
          url="https://conda.anaconda.org/conda-forge/$subdir/$archive"
          download="$RUNNER_TEMP/$archive"
          openssl_archive="openssl-$OCTAVE_MACOS_OPENSSL_VERSION-$openssl_build.conda"
          openssl_url="https://conda.anaconda.org/conda-forge/$subdir/$openssl_archive"
          openssl_download="$RUNNER_TEMP/$openssl_archive"
          prefix="$RUNNER_TEMP/reference-octave-$subdir"
          rm -f "$download"
          rm -f "$openssl_download"
          rm -rf "$prefix"
          curl --fail --location --retry 3 --output "$download" "$url"
          printf '%s  %s\n' "$expected_sha" "$download" | shasum -a 256 -c -
          curl --fail --location --retry 3 --output "$openssl_download" "$openssl_url"
          printf '%s  %s\n' "$openssl_sha" "$openssl_download" | shasum -a 256 -c -
          python3 vendor/python-runtime-consumer-kit/tools/install-pinned-octave-macos.py \
            --micromamba "$MAMBA_EXE" --prefix "$prefix" --subdir "$subdir" \
            --octave-archive "$download" --octave-sha256 "$expected_sha" \
            --octave-version "$OCTAVE_MACOS_VERSION" --octave-build "$build" \
            --openssl-archive "$openssl_download" --openssl-sha256 "$openssl_sha" \
            --openssl-version "$OCTAVE_MACOS_OPENSSL_VERSION" --openssl-build "$openssl_build"
          "$MAMBA_EXE" list -p "$prefix"
          python3 - "$prefix" "$OCTAVE_MACOS_VERSION" "$build" "$OCTAVE_MACOS_OPENSSL_VERSION" "$openssl_build" <<'PY'
          import json
          import pathlib
          import sys

          prefix = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]
          expected_build = sys.argv[3]
          expected_openssl_version = sys.argv[4]
          expected_openssl_build = sys.argv[5]
          packages = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted((prefix / "conda-meta").glob("*.json"))
          ]
          octave = [record for record in packages if record.get("name") == "octave"]
          if len(octave) != 1:
              raise SystemExit(f"expected one GNU Octave package, found {len(octave)}")
          octave_build = octave[0].get("build_string", octave[0].get("build"))
          if octave[0].get("version") != expected_version or octave_build != expected_build:
              raise SystemExit(
                  "GNU Octave package identity mismatch: "
                  f"{octave[0].get('version')}={octave_build} != {expected_version}={expected_build}"
              )
          openssl = [record for record in packages if record.get("name") == "openssl"]
          if len(openssl) != 1:
              raise SystemExit(f"expected one OpenSSL package, found {len(openssl)}")
          openssl_build = openssl[0].get("build_string", openssl[0].get("build"))
          if (
              openssl[0].get("version") != expected_openssl_version
              or openssl_build != expected_openssl_build
          ):
              raise SystemExit(
                  "GNU Octave OpenSSL identity mismatch: "
                  f"{openssl[0].get('version')}={openssl_build} != "
                  f"{expected_openssl_version}={expected_openssl_build}"
              )
          forbidden = {"mpi", "mpich", "openmpi", "open-mpi"}
          present = sorted(
              record["name"]
              for record in packages
              if str(record.get("name", "")).lower() in forbidden
          )
          if present:
              raise SystemExit(f"GNU Octave host environment contains an MPI runtime: {present}")
          PY
          if find "$prefix" -type f \( -name 'libmpi*.dylib' -o -name 'libmpich*.dylib' \) -print -quit | grep -q .; then
            echo "GNU Octave host environment contains an MPI shared library" >&2
            exit 1
          fi
          octave="$prefix/bin/octave-cli"
          octave_config="$prefix/bin/octave-config"
          test -x "$octave"
          test -x "$octave_config"
          export OCTAVE_HOME="$prefix"
          test "$("$octave_config" -p VERSION)" = "$OCTAVE_MACOS_VERSION"
          test "$("$octave_config" -p OCTAVE_HOME)" = "$prefix"
          mex_header="$(find "$prefix/include" -type f -name mex.h -print -quit)"
          test -n "$mex_header"
          test -f "$mex_header"
          echo "REFERENCE_OCTAVE=$octave" >> "$GITHUB_ENV"
          echo "OCTAVE_HOME=$prefix" >> "$GITHUB_ENV"
          echo "OCTAVE_VERSION=$OCTAVE_MACOS_VERSION" >> "$GITHUB_ENV"
          echo "OCTAVE_INCLUDE_DIRS=$(dirname "$mex_header")" >> "$GITHUB_ENV"

      - name: Stage and re-attest selected runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="build/reference/test/${{ matrix.target }}/${{ matrix.profile }}"
          staged="$root/staged-runtime"
          package="$root/package"
          record="build/reference/records/${{ matrix.target }}-${{ matrix.profile }}.json"
          verify_record="build/reference/records/${{ matrix.target }}-${{ matrix.profile }}-verify.json"
          layout_record="build/reference/records/${{ matrix.target }}-${{ matrix.profile }}-layout.json"
          python vendor/python-runtime-consumer-kit/tools/stage-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --cache build/reference-cache --output "$staged" --record "$record"
          python vendor/python-runtime-consumer-kit/tools/verify-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --cache build/reference-cache --runtime "$staged" --record "$verify_record"
          python tools/prepare_consumer_layout.py --runtime "$staged" --mex "build/reference/candidate/${{ matrix.target }}/bridge.mex" --profile "${{ matrix.profile }}" --backend python/mock_backend.py --host-fixture host/mock_smoke.m --output "$package" --record "$layout_record"

      - name: Smoke standalone staged NumPy on Linux
        if: matrix.target == 'linux-x64' && matrix.profile != 'core'
        shell: bash
        run: |
          set -euo pipefail
          runtime="build/reference/test/${{ matrix.target }}/${{ matrix.profile }}/staged-runtime"
          "$runtime/bin/python3.14" -B -I -c 'import numpy as np; assert np.__version__ == "2.5.2"; assert int(np.arange(6, dtype=np.int64).sum()) == 15; print(f"reference_numpy_standalone=pass:{np.__file__}")'

      - name: Execute GNU Octave host acceptance on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & vendor/python-runtime-consumer-kit/tools/test-octave.ps1 -PackageRoot "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}/package" -Octave $env:REFERENCE_OCTAVE

      - name: Execute GNU Octave host acceptance on Linux
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e "OCTAVE_LINUX_VERSION=$OCTAVE_LINUX_VERSION" \
            -v "$workspace:$workspace" \
            -w "$workspace" \
            --entrypoint bash \
            "$OCTAVE_LINUX_IMAGE" \
            -lc '
              set -euo pipefail
              test "$(octave-config -p VERSION)" = "$OCTAVE_LINUX_VERSION"
              bash vendor/python-runtime-consumer-kit/tools/test-octave-linux.sh \
                --package-root "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}/package" \
                --octave "$(command -v octave-cli)"
            '

      - name: Execute GNU Octave host acceptance on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          bash vendor/python-runtime-consumer-kit/tools/test-octave-macos.sh --package-root "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}/package" --octave "$REFERENCE_OCTAVE"

      - name: Write exact-candidate qualification
        shell: bash
        run: |
          set -euo pipefail
          python vendor/python-runtime-consumer-kit/tools/write-qualification.py --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --mex "build/reference/candidate/${{ matrix.target }}/bridge.mex" --build-provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json" --runtime-receipt "build/reference/records/${{ matrix.target }}-${{ matrix.profile }}.json" --native-audit "build/reference/candidate/${{ matrix.target }}/native-audit.json" --output "build/reference/qualification-reference-${{ matrix.target }}-${{ matrix.profile }}.json" --check octave_host=pass --check repeated_calls=pass --check fresh_process=pass --check relocated_runtime=pass --check native_boundary=pass

      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-qualification-${{ matrix.target }}-${{ matrix.profile }}
          path: |
            build/reference/qualification-reference-${{ matrix.target }}-${{ matrix.profile }}.json
            build/reference/records/${{ matrix.target }}-${{ matrix.profile }}.json
            build/reference/records/${{ matrix.target }}-${{ matrix.profile }}-verify.json
            build/reference/records/${{ matrix.target }}-${{ matrix.profile }}-layout.json
          if-no-files-found: error
          retention-days: 14
